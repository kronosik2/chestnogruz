<!DOCTYPE html>
<html>
<head>
    <title>Тест входа ЧестноГруз</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

<div class="max-w-md mx-auto bg-white rounded-xl p-6">
    <h1 class="text-2xl font-bold text-center mb-4">ЧестноГруз</h1>
    
    <div id="step1">
        <input type="tel" id="phone" placeholder="+7 999 123-45-67" class="w-full border p-3 rounded-lg mb-3">
        <button onclick="sendCode()" class="w-full bg-orange-500 text-white py-3 rounded-lg">Получить код</button>
        <p class="text-xs text-gray-400 text-center mt-2">Тестовый код: <strong>123456</strong></p>
    </div>

    <div id="step2" class="hidden">
        <input type="text" id="code" placeholder="Введите код" class="w-full border p-3 rounded-lg mb-3">
        <button onclick="verifyCode()" class="w-full bg-green-500 text-white py-3 rounded-lg">Подтвердить</button>
        <button onclick="back()" class="w-full mt-2 text-gray-500">Назад</button>
    </div>

    <div id="success" class="hidden text-center text-green-600 font-bold mt-4">
        ✅ Вход выполнен!
    </div>
</div>

<script>
    function sendCode() {
        const phone = document.getElementById('phone').value;
        if (!phone) {
            alert('Введите номер телефона');
            return;
        }
        // Переключаем на шаг ввода кода
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
    }

    function verifyCode() {
        const code = document.getElementById('code').value;
        if (code === '123456') {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('success').classList.remove('hidden');
        } else {
            alert('Неверный код. Попробуйте 123456');
        }
    }

    function back() {
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step1').classList.remove('hidden');
        document.getElementById('code').value = '';
    }
</script>

</body>
</html>
