<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ЧестноГруз — заказ грузчиков без посредников</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active {
            border-bottom-width: 2px;
            border-color: #f59e0b;
            color: #f59e0b;
        }
        .order-card {
            transition: all 0.2s ease;
        }
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .workers-btn-active {
            background-color: #f59e0b;
            color: white;
            border-color: #f59e0b;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased">

    <div id="appContent" class="max-w-3xl mx-auto px-4 py-6 pb-20 hidden">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🤝</span>
                <h1 class="text-2xl font-bold text-gray-800">ЧестноГруз</h1>
            </div>
            <button id="profileBtn" class="bg-gray-100 p-2 rounded-full hover:bg-gray-200 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </button>
        </div>

        <div class="flex border-b border-gray-200 mb-6">
            <button id="tabCreate" class="flex-1 py-3 text-center font-medium text-gray-500 tab-active transition">Создать заявку</button>
            <button id="tabOrders" class="flex-1 py-3 text-center font-medium text-gray-500 transition">Мои заявки</button>
        </div>

        <div id="content">
            <div class="text-center py-10 text-gray-400">Загрузка...</div>
        </div>
    </div>

    <div id="profileModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl w-11/12 max-w-md p-6 relative">
            <button id="closeModal" class="absolute top-3 right-4 text-gray-400 text-2xl">&times;</button>
            <h2 class="text-xl font-bold mb-4">Ваш профиль</h2>
            <div class="space-y-3">
                <div><span class="font-medium">Телефон:</span> <span id="profilePhone"></span></div>
                <div><span class="font-medium">Имя:</span> <span id="profileName"></span></div>
                <div><span class="font-medium">Рейтинг:</span> <span id="profileRating">5.0</span></div>
                <div class="pt-2 border-t"><span class="font-medium text-red-600">Долг:</span> <span id="profileDebt" class="text-red-600 font-bold">0 ₽</span></div>
                <button id="logoutBtn" class="mt-4 w-full bg-gray-200 py-2 rounded-lg text-gray-700">Выйти из аккаунта</button>
            </div>
        </div>
    </div>

    <div id="authModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl w-11/12 max-w-md p-6">
            <div class="text-center mb-6">
                <span class="text-4xl">🤝</span>
                <h2 class="text-xl font-bold mt-2">ЧестноГруз</h2>
                <p class="text-gray-500 text-sm">Вход по телефону</p>
            </div>
            
            <div id="authPhoneStep">
                <input type="tel" id="phoneInput" placeholder="+7 999 123-45-67" class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-4 text-center text-lg">
                <button id="sendCodeBtn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition">Получить код</button>
                <p class="text-xs text-gray-400 text-center mt-3">📱 Тестовый код: <span class="font-mono font-bold">123456</span></p>
            </div>

            <div id="authCodeStep" class="hidden">
                <input type="text" id="codeInput" placeholder="Введите код" class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-4 text-center text-lg">
                <button id="verifyCodeBtn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition">Подтвердить</button>
                <button id="backToPhoneBtn" class="w-full mt-2 text-gray-500 text-sm">Изменить номер</button>
            </div>

            <div id="authError" class="text-red-500 text-sm text-center mt-3 hidden"></div>
            <p class="text-xs text-gray-400 text-center mt-4">Вход означает согласие с офертой</p>
        </div>
    </div>

    <script>
        // ========== НАСТРОЙКИ TELEGRAM (ТВОИ ДАННЫЕ) ==========
        const TELEGRAM_BOT_TOKEN = '8727111036:AAEtREM0b27n7m6Ue9jUKQYhPnD4Pz2iF88';
        const TELEGRAM_CHAT_ID = '8727111036';
        // =====================================================

        let currentUser = null;
        let currentTab = 'create';
        let orders = [];

        const appContent = document.getElementById('appContent');
        const authModal = document.getElementById('authModal');
        const contentDiv = document.getElementById('content');
        const tabCreateBtn = document.getElementById('tabCreate');
        const tabOrdersBtn = document.getElementById('tabOrders');
        const profileBtn = document.getElementById('profileBtn');
        const profileModal = document.getElementById('profileModal');
        const closeModal = document.getElementById('closeModal');
        const logoutBtn = document.getElementById('logoutBtn');

        // ========== ОТПРАВКА В TELEGRAM ==========
        async function sendToTelegram(orderText) {
            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: orderText,
                        parse_mode: 'HTML'
                    })
                });
                const result = await response.json();
                if (!result.ok) {
                    console.error('Telegram API error:', result);
                } else {
                    console.log('Заказ отправлен в Telegram');
                }
            } catch (error) {
                console.error('Ошибка отправки в Telegram:', error);
            }
        }

        // ========== АВТОРИЗАЦИЯ (ТЕСТОВАЯ) ==========
        function sendCode() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) {
                showAuthError('Введите номер телефона');
                return;
            }
            currentUser = { phone: phone, name: 'Клиент', debt: 0, rating: 5.0 };
            document.getElementById('authPhoneStep').classList.add('hidden');
            document.getElementById('authCodeStep').classList.remove('hidden');
            showAuthError('✅ Код отправлен (тестовый: 123456)');
        }

        function verifyCode() {
            const code = document.getElementById('codeInput').value.trim();
            if (code === '123456') {
                authModal.classList.add('hidden');
                appContent.classList.remove('hidden');
                renderProfileInfo();
                loadContentByTab();
            } else {
                showAuthError('❌ Неверный код. Попробуйте 123456');
            }
        }

        function backToPhone() {
            document.getElementById('authCodeStep').classList.add('hidden');
            document.getElementById('authPhoneStep').classList.remove('hidden');
            document.getElementById('codeInput').value = '';
            showAuthError('');
        }

        function showAuthError(msg) {
            const errorDiv = document.getElementById('authError');
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
            if (msg.includes('✅')) {
                errorDiv.classList.add('text-green-500');
                errorDiv.classList.remove('text-red-500');
            } else {
                errorDiv.classList.add('text-red-500');
                errorDiv.classList.remove('text-green-500');
            }
        }

        function renderProfileInfo() {
            if (!currentUser) return;
            document.getElementById('profilePhone').innerText = currentUser.phone;
            document.getElementById('profileName').innerText = currentUser.name;
            document.getElementById('profileDebt').innerText = currentUser.debt + ' ₽';
        }

        function logout() {
            currentUser = null;
            appContent.classList.add('hidden');
            authModal.classList.remove('hidden');
            document.getElementById('authPhoneStep').classList.remove('hidden');
            document.getElementById('authCodeStep').classList.add('hidden');
            document.getElementById('phoneInput').value = '';
            document.getElementById('codeInput').value = '';
        }

        // ========== ФОРМА СОЗДАНИЯ ЗАЯВКИ ==========
        function renderCreateForm() {
            contentDiv.innerHTML = `
                <form id="orderForm" class="space-y-5 bg-white p-5 rounded-xl shadow-sm">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Город</label>
                        <input type="text" id="city" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Адрес</label>
                        <input type="text" id="address" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Количество грузчиков</label>
                        <div class="flex gap-3">
                            <button type="button" data-workers="1" class="workers-btn flex-1 py-2 border border-gray-300 rounded-lg hover:bg-orange-100 transition">1</button>
                            <button type="button" data-workers="2" class="workers-btn flex-1 py-2 border border-gray-300 rounded-lg hover:bg-orange-100 transition">2</button>
                            <button type="button" data-workers="3" class="workers-btn flex-1 py-2 border border-gray-300 rounded-lg hover:bg-orange-100 transition">3</button>
                            <button type="button" data-workers="4" class="workers-btn flex-1 py-2 border border-gray-300 rounded-lg hover:bg-orange-100 transition">4</button>
                        </div>
                        <input type="hidden" id="workers" value="2">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Дата</label>
                            <input type="date" id="date" class="w-full border border-gray-300 rounded-lg px-4 py-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Время</label>
                            <input type="time" id="time" class="w-full border border-gray-300 rounded-lg px-4 py-2">
                        </div>
                    </div>

                    <div>
                        <button type="button" id="asapBtn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 rounded-xl transition border border-gray-300">
                            🚀 На ближайшее время
                        </button>
                        <p class="text-xs text-gray-400 mt-1">Заблокирует выбор даты и времени</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ставка (₽/час за 1 грузчика)</label>
                        <input type="number" id="rate" value="400" class="w-full border border-gray-300 rounded-lg px-4 py-2">
                        <p class="text-xs text-gray-400 mt-1">Рекомендуемая ставка: 400₽/час</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Комментарий</label>
                        <textarea id="comment" rows="2" class="w-full border border-gray-300 rounded-lg px-4 py-2"></textarea>
                    </div>

                    <div class="flex items-start">
                        <input type="checkbox" id="offerAccepted" required class="mt-1 mr-2">
                        <label class="text-sm text-gray-600">Я принимаю условия оферты и соглашаюсь оплатить 50₽ за каждого грузчика после выполнения заказа.</label>
                    </div>

                    <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition">Создать заказ</button>
                </form>
                <div class="mt-4 text-center text-xs text-gray-400">После создания заказа мы уведомим грузчиков. Оплата — после выполнения.</div>
            `;

            // Кнопки выбора грузчиков
            const workersBtns = document.querySelectorAll('.workers-btn');
            const workersInput = document.getElementById('workers');
            workersBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    workersBtns.forEach(b => b.classList.remove('workers-btn-active', 'bg-orange-500', 'text-white'));
                    btn.classList.add('workers-btn-active', 'bg-orange-500', 'text-white');
                    workersInput.value = btn.getAttribute('data-workers');
                });
            });
            document.querySelector('.workers-btn[data-workers="2"]').classList.add('workers-btn-active', 'bg-orange-500', 'text-white');

            // Кнопка "На ближайшее время"
            const asapBtn = document.getElementById('asapBtn');
            const dateInput = document.getElementById('date');
            const timeInput = document.getElementById('time');
            let asapMode = false;
            asapBtn.addEventListener('click', () => {
                asapMode = !asapMode;
                if (asapMode) {
                    dateInput.disabled = true;
                    timeInput.disabled = true;
                    dateInput.value = '';
                    timeInput.value = '';
                    asapBtn.classList.add('bg-orange-500', 'text-white', 'border-orange-500');
                    asapBtn.classList.remove('bg-gray-100', 'text-gray-700');
                } else {
                    dateInput.disabled = false;
                    timeInput.disabled = false;
                    asapBtn.classList.remove('bg-orange-500', 'text-white', 'border-orange-500');
                    asapBtn.classList.add('bg-gray-100', 'text-gray-700');
                }
            });

            document.getElementById('orderForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const city = document.getElementById('city').value;
                const address = document.getElementById('address').value;
                const грузчиков = parseInt(document.getElementById('workers').value);
                const rate = parseInt(document.getElementById('rate').value);
                const comment = document.getElementById('comment').value;
                const isAsap = dateInput.disabled;
                const date = isAsap ? 'сегодня' : dateInput.value;
                const time = isAsap ? 'в ближайшее время' : timeInput.value;
                
                if (!city || !address) {
                    alert('Заполните город и адрес');
                    return;
                }
                if (!document.getElementById('offerAccepted').checked) {
                    alert('Примите условия оферты');
                    return;
                }

                const orderText = `
🆕 <b>НОВЫЙ ЗАКАЗ</b>
👤 Клиент: ${currentUser.phone}
📍 ${city}, ${address}
📅 ${date} ${time}
👥 ${грузчиков} грузчика
💰 Ставка: ${rate} ₽/час за грузчика
📝 Комментарий: ${comment || '—'}
🕐 Создан: ${new Date().toLocaleString()}
                `.trim();

                await sendToTelegram(orderText);

                const newOrder = {
                    id: Math.random().toString(36).substr(2, 8),
                    city, address, date, time, грузчиков, rate, comment,
                    status: 'new',
                    created_at: new Date().toISOString()
                };
                orders.unshift(newOrder);
                alert('✅ Заказ отправлен грузчикам!');
                document.getElementById('orderForm').reset();
                document.getElementById('workers').value = '2';
                document.querySelector('.workers-btn[data-workers="2"]').classList.add('workers-btn-active', 'bg-orange-500', 'text-white');
                document.getElementById('rate').value = '400';
                if (asapMode) asapBtn.click();
                currentTab = 'orders';
                updateTabUI();
                renderOrdersList();
            });
        }

        // ========== ЛЕНТА ЗАЯВОК ==========
        function renderOrdersList() {
            if (orders.length === 0) {
                contentDiv.innerHTML = '<div class="bg-white rounded-xl p-8 text-center text-gray-400">У вас пока нет заявок. Создайте первую!</div>';
                return;
            }

            let html = '<div class="space-y-4">';
            for (let order of orders) {
                const isActive = order.status === 'new' || order.status === 'active';
                const statusText = order.status === 'new' ? '🔍 Ищем' : (order.status === 'active' ? '⚡ В работе' : '✅ Выполнен');
                const statusColor = order.status === 'new' ? 'text-blue-600 bg-blue-50' : (order.status === 'active' ? 'text-orange-600 bg-orange-50' : 'text-green-600 bg-green-50');
                html += `
                    <div class="order-card bg-white rounded-xl p-4 shadow-sm border-l-4 ${isActive ? 'border-orange-400' : 'border-gray-200'}">
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-bold">Заказ #${order.id}</span>
                            <span class="text-xs px-2 py-1 rounded-full ${statusColor}">${statusText}</span>
                        </div>
                        <div class="text-sm text-gray-600">
                            📍 ${order.city}, ${order.address}<br>
                            📅 ${order.date} ${order.time}<br>
                            👥 ${order.грузчиков} грузчика • 💰 ${order.rate}₽/час<br>
                            ${order.comment ? `📝 ${order.comment}` : ''}
                        </div>
                        ${order.status === 'completed' ? `<div class="mt-3 text-right"><button class="text-orange-500 payDebtBtn" data-amount="${order.грузчиков * 50}">💰 Оплатить ${order.грузчиков * 50}₽</button></div>` : ''}
                    </div>
                `;
            }
            html += '</div>';
            contentDiv.innerHTML = html;
            
            document.querySelectorAll('.payDebtBtn').forEach(btn => {
                btn.addEventListener('click', () => alert('🚧 Оплата через ЮKassa будет позже. Сейчас демо.'));
            });
        }

        function updateTabUI() {
            if (currentTab === 'create') {
                tabCreateBtn.classList.add('tab-active');
                tabOrdersBtn.classList.remove('tab-active');
            } else {
                tabOrdersBtn.classList.add('tab-active');
                tabCreateBtn.classList.remove('tab-active');
            }
        }

        function loadContentByTab() {
            if (currentTab === 'create') {
                renderCreateForm();
            } else {
                renderOrdersList();
            }
        }

        // ========== СОБЫТИЯ ==========
        tabCreateBtn.addEventListener('click', () => {
            currentTab = 'create';
            updateTabUI();
            loadContentByTab();
        });
        
        tabOrdersBtn.addEventListener('click', () => {
            currentTab = 'orders';
            updateTabUI();
            loadContentByTab();
        });

        profileBtn.addEventListener('click', () => {
            renderProfileInfo();
            profileModal.classList.remove('hidden');
        });
        
        closeModal.addEventListener('click', () => profileModal.classList.add('hidden'));
        
        logoutBtn.addEventListener('click', () => {
            logout();
            profileModal.classList.add('hidden');
        });
        
        profileModal.addEventListener('click', (e) => {
            if (e.target === profileModal) profileModal.classList.add('hidden');
        });

        document.getElementById('sendCodeBtn').addEventListener('click', sendCode);
        document.getElementById('verifyCodeBtn').addEventListener('click', verifyCode);
        document.getElementById('backToPhoneBtn').addEventListener('click', backToPhone);
    </script>
</body>
</html>
